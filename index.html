<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Returning to Filternizer</title>
  </head>
  <body>
    <p>Returning to Filternizer…</p>
    <script>
      // Trello places its token in this page's URL fragment; the app's anti-forgery `state`
      // nonce is in the query string. Neither the fragment nor this script sends anything to a
      // server: both are handed straight to the installed app, which verifies the state.
      window.location.replace(`filternizer://trello-auth${window.location.search}${window.location.hash}`);
    </script>
  </body>
</html>
